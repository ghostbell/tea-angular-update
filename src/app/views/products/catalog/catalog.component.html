<section class="products py-5">
  <div class="container">
    <p class="products-title fw-bold fs-2 text-center">Наши чайные коллекции</p>
    <div class="products-items">
      <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-3 g-4">
        <product-card *ngFor="let product of products" [product]="product" class="col"></product-card>
      </div>
    </div>
  </div>
</section>
