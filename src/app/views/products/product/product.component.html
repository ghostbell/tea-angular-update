<section class="product">
  <div class="container vh-100 d-flex flex-column align-items-center justify-content-center">
    <h1 class="mb-5">Описание чая</h1>

    <div class="product-item d-flex">
      <a class="card-image" href="{{ product.image }}">
        <img src="{{ product.image }}" class="card-img-top" alt="Tea">
      </a>
      <div class="card-body d-md-block d-sm-flex flex-column align-items-center">
        <h2 class="card-title fw-bold mb-4">{{ product.title }}</h2>
        <p class="card-text">{{ product.description }}</p>
        <p class="card-price fs-5 fw-medium mt-4">Цена: {{ product.price }} руб.</p>
        <a routerLink="/order" class="btn btn-primary hvr-bob w-25">Купить</a>
      </div>
    </div>
  </div>
</section>
